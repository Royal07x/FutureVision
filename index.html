<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Vision</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="story">

        <!-- Scene 1 -->
        <section class="scene active">
            <div class="sky"></div>

            <div class="character">
                <div class="head"></div>
                <div class="body"></div>
                <div class="leg left"></div>
                <div class="leg right"></div>
            </div>

            <div class="dialogue">
                <span>What If...</span><br>
                Tumhe 10 Minute Future<br>
                Dekhne Ki Power Mil Jaye?
            </div>
        </section>

        <!-- Scene 2 -->
        <section class="scene">
            <div class="city"></div>

            <div class="character running">
                <div class="head"></div>
                <div class="body"></div>
                <div class="leg left"></div>
                <div class="leg right"></div>
            </div>

            <div class="dialogue">
                Ruko... mujhe kuch hone wala hai!
            </div>
        </section>

        <!-- Scene 3 -->
        <section class="scene">
            <div class="dark-screen"></div>

            <div class="future-text">
                ⚡ 10 MINUTES LATER ⚡
            </div>

            <div class="dialogue">
                Jo maine dekha tha...<br>
                woh sach ho raha hai!
            </div>
        </section>

        <!-- Scene 4 -->
        <section class="scene">
            <div class="final-bg"></div>

            <div class="dialogue final">
                Lekin future dekhne ki<br>
                sabse badi keemat kya thi?
            </div>

            <button onclick="restartStory()">🔄 Replay</button>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
